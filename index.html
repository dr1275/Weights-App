<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Weights</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--good:#15803d;--warn:#b45309;--bad:#dc2626}
[data-theme=dark]{--bg:#0b1020;--card:#151b2d;--text:#f3f4f6;--muted:#9ca3af;--line:#293246;--accent:#60a5fa;--good:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 13px;background:var(--accent);color:white;font-weight:650}button.secondary{background:var(--line);color:var(--text)}button.danger{background:var(--bad)}button.ghost{background:transparent;color:var(--accent);padding:6px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(15px);padding:13px 15px calc(9px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}h1{margin:0;font-size:24px}.sub{color:var(--muted);margin-top:2px}.wrap{max-width:780px;margin:auto;padding:15px 13px 95px}
nav{position:fixed;z-index:10;bottom:0;left:0;right:0;padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around}nav button{background:transparent;color:var(--muted);padding:6px 3px;font-size:11px}.active{color:var(--accent)!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{font-size:23px;font-weight:750}.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--line);font-size:11px}.pr{color:var(--good);font-weight:750}.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}.actions{display:flex;gap:7px;flex-wrap:wrap}.exercise{border-top:1px solid var(--line);padding-top:11px;margin-top:11px}.set{display:grid;grid-template-columns:25px 1fr 1fr 38px;gap:5px;align-items:center;margin:6px 0}.set input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:56px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);padding:4px;text-align:left;font-size:11px}.day.today{outline:2px solid var(--accent)}.day.has{background:color-mix(in srgb,var(--accent) 13%,var(--card))}.day.done{box-shadow:inset 0 -3px 0 var(--good)}.modal{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end}.modal>div{width:100%;max-height:91vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:17px}.hidden{display:none!important}.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;z-index:30}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:11px}.tabs button{white-space:nowrap}.section-title{font-size:18px;font-weight:750;margin:14px 0 8px}.metric{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.metric:last-child{border:0}.chart{height:150px;display:flex;align-items:end;gap:4px;padding-top:10px}.col{flex:1;background:var(--accent);min-height:3px;border-radius:4px 4px 0 0}.col span{display:block;font-size:9px;text-align:center;transform:translateY(-14px)}.legend{font-size:10px;color:var(--muted);text-align:center}.check{accent-color:var(--accent);width:20px;height:20px}.toggle{display:flex;align-items:center;gap:9px}
</style>
</head>
<body>
<header><h1>Weights</h1><div class=sub id=dateLine></div></header>
<main class=wrap id=app></main>
<nav><button data-page=home>⌂<br>Today</button><button data-page=calendar>▦<br>Calendar</button><button data-page=routines>☷<br>Routines</button><button data-page=progress>↗<br>Progress</button><button data-page=settings>⚙<br>Settings</button></nav>
<div id=modal class="modal hidden"></div>
<script>
const KEY="weights-v2";
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{theme:"dark",routines:[],schedule:{},history:[],settings:{unit:"kg"}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(db)), uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date().toISOString().slice(0,10), fmt=d=>new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const routine=id=>db.routines.find(r=>r.id===id), scheduled=d=>db.schedule[d]||[];
function theme(){document.documentElement.dataset.theme=db.theme}
theme();document.getElementById("dateLine").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
let page="home",activeWorkout=null,timer=null,monthCursor=new Date(),analysisId=null;
function toast(x){let e=document.createElement("div");e.className="toast";e.textContent=x;document.body.append(e);setTimeout(()=>e.remove(),1800)}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("app").innerHTML=({home,calendar,routines,progress,settings}[page])()}
function allLogsForExercise(id){let a=[];db.history.forEach(h=>h.exercises.forEach(e=>{if(e.exerciseId===id)a.push({...e,date:h.date,duration:h.duration||0,workoutId:h.id})}));return a.sort((a,b)=>a.date.localeCompare(b.date))}
function volume(sets){return sets.reduce((n,s)=>(n+(+s.weight||0)*(+s.reps||0)),0)}
function prs(id){let logs=allLogsForExercise(id),maxW=0,maxV=0,maxR=0;logs.forEach(e=>e.sets.forEach(s=>{maxW=Math.max(maxW,+s.weight||0);maxV=Math.max(maxV,(+s.weight||0)*(+s.reps||0));maxR=Math.max(maxR,+s.reps||0)}));return{maxW,maxV,maxR}}
function lastNDays(n){let a=[];for(let i=0;i<n;i++){let d=new Date();d.setDate(d.getDate()-i);a.push(d.toISOString().slice(0,10))}return a}
function home(){
 let t=today(),s=scheduled(t),td=new Date();td.setDate(td.getDate()+1);let tomorrow=td.toISOString().slice(0,10);
 let recent=db.history.filter(h=>h.date<t).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
 let todayDone=db.history.filter(h=>h.date===t), scheduledNames=s.map(x=>routine(x.routineId)?.name).filter(Boolean);
 let exercises=s.flatMap(x=>(x.exerciseIds||[]).map(id=>routine(x.routineId)?.exercises.find(e=>e.id===id)).filter(Boolean));
 return `<div class=card><div class="row between"><div><b>Today's plan</b><div class=muted>${fmt(t)}</div></div><button onclick="startScheduled()">Start</button></div>
 ${scheduledNames.length?scheduledNames.map(n=>`<span class=pill>${esc(n)}</span>`).join(" "):"<p class=muted>Nothing scheduled.</p>"}
 ${exercises.length?`<div class=small style="margin-top:8px">${exercises.map(e=>esc(e.name)).join(" · ")}</div>`:""}
 ${todayDone.length?`<div class=pr style="margin-top:8px">✓ ${todayDone.length} workout completed today</div>`:""}</div>
 <div class=grid><div class=card><div class=muted>Sessions · 5 days</div><div class=stat>${db.history.filter(h=>lastNDays(5).includes(h.date)).length}</div></div><div class=card><div class=muted>Routines</div><div class=stat>${db.routines.length}/15</div></div></div>
 <div class=card><b>Recent 5 days</b>${recent.length?recent.map(h=>`<div class=exercise><div class=row between><b>${esc(h.name)}</b><span>${fmt(h.date)}</span></div><div class=muted>${h.exercises.length} exercises · ${h.duration||0} min · ${Math.round(h.exercises.reduce((n,e)=>n+volume(e.sets),0))} kg volume</div></div>`).join(""):"<p class=muted>No completed workouts yet.</p>"}</div>
 <div class=card><b>Tomorrow</b><p>${scheduled(tomorrow).length?scheduled(tomorrow).map(x=>esc(routine(x.routineId)?.name)).join(", "):"Nothing scheduled."}</p></div>
 ${exercises.length?`<div class=card><b>Today's historical performance</b>${exercises.map(e=>exerciseMini(e.id)).join("")}</div>`:""}`;
}
function exerciseMini(id){let logs=allLogsForExercise(id),p=prs(id),last=logs.at(-1);return `<div class=exercise><div class=row between><b>${esc(last?.name||"Exercise")}</b>${p.maxW?`<span class=pr>PR ${p.maxW} kg</span>`:""}</div><div class=metric><span>Last</span><span>${last?Math.round(volume(last.sets))+" kg volume":"—"}</span></div><div class=metric><span>Best weight</span><span>${p.maxW||0} kg</span></div></div>`}
function calendar(){
 let y=monthCursor.getFullYear(),m=monthCursor.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),start=first.getDay(),cells="";
 for(let i=0;i<start;i++)cells+="<div></div>";
 for(let n=1;n<=days;n++){let ds=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`,has=scheduled(ds).length,done=db.history.some(h=>h.date===ds),txt=scheduled(ds).map(x=>esc(routine(x.routineId)?.name)).join(", ");cells+=`<button class="day ${ds===today()?"today ":""}${has?"has ":""}${done?"done":""}" onclick="scheduleDay('${ds}')"><b>${n}</b><br>${txt}</button>`}
 return `<div class=card><div class="row between"><button class=secondary onclick="monthMove(-1)">‹</button><b>${monthCursor.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b><button class=secondary onclick="monthMove(1)">›</button></div><div class=calendar style="margin-top:10px">${["S","M","T","W","T","F","S"].map(x=>`<div class=muted style="text-align:center">${x}</div>`).join("")}${cells}</div></div>
 <div class=card><b>How to schedule</b><p class=muted>Tap any day, choose a routine, then select which exercises you want that day. Completed days are marked in green.</p></div>`;
}
function monthMove(n){monthCursor.setMonth(monthCursor.getMonth()+n);render()}
function scheduleDay(ds){
 let current=scheduled(ds)[0],rid=current?.routineId||db.routines[0]?.id;
 openModal(`<div class=row between><h2>${fmt(ds)}</h2><button class=secondary onclick=closeModal()>Close</button></div>
 <div class=field><label>Routine</label><select id=srid onchange="showScheduleExercises(this.value,'${ds}')">${db.routines.map(r=>`<option value="${r.id}" ${r.id===rid?"selected":""}>${esc(r.name)}</option>`).join("")}</select></div>
 <div id=sex>${scheduleExercisesHtml(rid,current?.exerciseIds)}</div>
 <div class=actions><button onclick="saveSchedule('${ds}')">Save schedule</button>${current?`<button class=danger onclick="clearSchedule('${ds}')">Clear day</button>`:""}</div>`);
}
function showScheduleExercises(rid,ds){document.getElementById("sex").innerHTML=scheduleExercisesHtml(rid)}
function scheduleExercisesHtml(rid,selected){let r=routine(rid);if(!r)return "<p class=muted>Create a routine first.</p>";let ids=selected||r.exercises.map(e=>e.id);return `<div class=small>Exercises planned</div>${r.exercises.map(e=>`<label class=row style="margin:8px 0"><input class=check type=checkbox value="${e.id}" ${ids.includes(e.id)?"checked":""}> ${esc(e.name)}</label>`).join("")}`}
function saveSchedule(ds){let rid=document.getElementById("srid").value,ids=[...document.querySelectorAll("#sex input:checked")].map(x=>x.value);db.schedule[ds]=[{routineId:rid,exerciseIds:ids}];save();closeModal();render();toast("Schedule saved")}
function clearSchedule(ds){delete db.schedule[ds];save();closeModal();render()}
function startScheduled(){let s=scheduled(today())[0];if(!s){toast("Nothing scheduled today");return}beginRoutine(s.routineId,s.exerciseIds)}
function routines(){return `<div class=row between><h2>Routines</h2><button onclick="editRoutine()">+ Add</button></div><p class=muted>Up to 15 categories. They can be gym routines or activities such as Running, Badminton or Stretching.</p>
${db.routines.map(r=>`<div class=card><div class=row between><div><b>${esc(r.name)}</b><div class=muted>${r.exercises.length} exercises</div></div><div class=actions><button class=secondary onclick="editRoutine('${r.id}')">Edit</button><button onclick="beginRoutine('${r.id}')">Start</button></div></div><div class=small>${r.exercises.map(e=>esc(e.name)).join(" · ")||"Standalone activity"}</div></div>`).join("")}
${db.routines.length===0?`<div class=card><p>Create your first routine.</p><button onclick=editRoutine()>Create routine</button></div>`:""}`}
function editRoutine(id){let r=id?routine(id):{id:uid(),name:"",notes:"",exercises:[]};openModal(`<div class=row between><h2>${id?"Edit":"New"} routine</h2><button class=secondary onclick=closeModal()>Close</button></div>
<div class=field><label>Category / routine name</label><input id=rname value="${esc(r.name)}" placeholder="Triceps, Legs, Badminton, Stretching..."></div>
<div class=field><label>Routine notes</label><textarea id=rnotes rows=2>${esc(r.notes||"")}</textarea></div>
<div id=exlist>${r.exercises.map((e,i)=>editor(e,i)).join("")}</div>
<button class=secondary onclick=addEditor()>+ Exercise</button><div class=actions style="margin-top:12px"><button onclick="saveRoutine('${r.id}')">Save</button>${id?`<button class=danger onclick="deleteRoutine('${id}')">Delete</button>`:""}</div>`)}
function editor(e={},i){return `<div class=card exed><div class=row between><b>Exercise ${i+1}</b><button class=ghost onclick="this.closest('.exed').remove()">Remove</button></div><div class=field><label>Name</label><input class=ename value="${esc(e.name||"")}" placeholder="Exercise (leave blank for standalone activity)"></div><div class=field><label>Notes</label><input class=enotes value="${esc(e.notes||"")}"></div></div>`}
function addEditor(){let l=document.getElementById("exlist");l.insertAdjacentHTML("beforeend",editor({},l.children.length))}
function saveRoutine(id){let r=routine(id);if(!r){if(db.routines.length>=15){toast("15 routine categories reached");return}r={id,name:"",notes:"",exercises:[]};db.routines.push(r)}r.name=document.getElementById("rname").value.trim()||"Untitled";r.notes=document.getElementById("rnotes").value;r.exercises=[...document.querySelectorAll(".exed")].map(x=>({id:uid(),name:x.querySelector(".ename").value.trim(),notes:x.querySelector(".enotes").value})).filter(e=>e.name);save();closeModal();render();toast("Saved")}
function deleteRoutine(id){if(!confirm("Delete this routine? Historical workouts stay saved."))return;db.routines=db.routines.filter(r=>r.id!==id);save();closeModal();render()}
function beginRoutine(rid,exerciseIds){let r=routine(rid);let chosen=exerciseIds?.length?r.exercises.filter(e=>exerciseIds.includes(e.id)):r.exercises;activeWorkout={id:uid(),date:today(),name:r.name,routineId:rid,start:Date.now(),notes:"",exercises:chosen.map(e=>({exerciseId:e.id,name:e.name,sets:[{weight:"",reps:""}],notes:e.notes||""}))};workoutModal()}
function workoutModal(){openModal(`<div class=row between><div><h2>${esc(activeWorkout.name)}</h2><div class=muted>Elapsed <span id=clock>00:00</span></div></div><button class=secondary onclick=closeModal()>Close</button></div>
<div class=field><label>Workout notes</label><textarea id=wnote rows=2 oninput="activeWorkout.notes=this.value">${esc(activeWorkout.notes)}</textarea></div>
<div id=wb>${activeWorkout.exercises.map((e,i)=>workoutExercise(e,i)).join("")}</div>
<div class=actions><button class=secondary onclick=addWorkoutExercise()>+ Exercise</button><button onclick=completeWorkout()>Complete Workout</button></div>`);timer=setInterval(()=>{let c=document.getElementById("clock");if(c)c.textContent=clock(Math.floor((Date.now()-activeWorkout.start)/1000))},1000)}
function clock(s){return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
function workoutExercise(e,i){return `<div class=exercise><div class=row between><b>${esc(e.name||"Activity")}</b><button class=secondary onclick=addSet(${i})>+ Set</button></div>${e.sets.map((s,j)=>`<div class=set><span>${j+1}</span><input inputmode=decimal placeholder="kg" value="${esc(s.weight)}" oninput="activeWorkout.exercises[${i}].sets[${j}].weight=this.value"><input inputmode=numeric placeholder="reps" value="${esc(s.reps)}" oninput="activeWorkout.exercises[${i}].sets[${j}].reps=this.value"><button class=secondary onclick=removeSet(${i},${j})>×</button></div>`).join("")}<div class=field><input placeholder="Exercise note" value="${esc(e.notes)}" oninput="activeWorkout.exercises[${i}].notes=this.value"></div></div>`}
function refreshWorkout(){document.getElementById("wb").innerHTML=activeWorkout.exercises.map((e,i)=>workoutExercise(e,i)).join("")}
function addSet(i){activeWorkout.exercises[i].sets.push({weight:"",reps:""});refreshWorkout()}
function removeSet(i,j){if(activeWorkout.exercises[i].sets.length>1)activeWorkout.exercises[i].sets.splice(j,1);refreshWorkout()}
function addWorkoutExercise(){activeWorkout.exercises.push({exerciseId:uid(),name:"New exercise",sets:[{weight:"",reps:""}],notes:""});refreshWorkout()}
function completeWorkout(){clearInterval(timer);activeWorkout.duration=Math.round((Date.now()-activeWorkout.start)/60000);activeWorkout.manualDuration=null;db.history.push(activeWorkout);save();let p=detectNewPRs(activeWorkout);activeWorkout=null;closeModal();render();toast(p?"Workout saved · New PR!":"Workout saved")}
function detectNewPRs(w){let any=false;w.exercises.forEach(e=>{let before=allLogsForExercise(e.exerciseId).filter(x=>x.workoutId!==w.id),old=0;before.forEach(x=>x.sets.forEach(s=>old=Math.max(old,+s.weight||0)));e.sets.forEach(s=>{if((+s.weight||0)>old&&+s.weight){any=true}})});return any}
function progress(){let ids=[];db.routines.forEach(r=>r.exercises.forEach(e=>ids.push(e.id)));return `<h2>Progress</h2><div class=tabs><button class=${analysisId?"secondary":""} onclick="analysisId=null;render()">All</button>${ids.slice(0,12).map(id=>{let e=db.routines.flatMap(r=>r.exercises).find(x=>x.id===id);return `<button class=${analysisId===id?"":"secondary"} onclick="analysisId='${id}';render()">${esc(e.name)}</button>`}).join("")}</div>${analysisId?analysis(analysisId):summaryProgress(ids)}`}
function summaryProgress(ids){let used=[...new Set(ids)].filter(id=>allLogsForExercise(id).length);return used.length?used.map(id=>analysisCard(id)).join(""):`<div class=card><p class=muted>Complete workouts to build your analytics.</p></div>`}
function analysisCard(id){let e=db.routines.flatMap(r=>r.exercises).find(x=>x.id===id),logs=allLogsForExercise(id),p=prs(id),last=logs.at(-1);return `<div class=card onclick="analysisId='${id}';render()"><div class=row between><b>${esc(e?.name||last?.name)}</b>${p.maxW?`<span class=pr>PR ${p.maxW} kg</span>`:""}</div><div class=grid><div><span class=muted>Workouts</span><div class=stat>${logs.length}</div></div><div><span class=muted>Best weight</span><div class=stat>${p.maxW||0} kg</div></div></div><div class=metric><span>All-time volume</span><span>${Math.round(logs.reduce((n,x)=>n+volume(x.sets),0))} kg</span></div><div class=metric><span>Last workout</span><span>${last?fmt(last.date):"—"}</span></div></div>`}
function analysis(id){let e=db.routines.flatMap(r=>r.exercises).find(x=>x.id===id),logs=allLogsForExercise(id),p=prs(id),now=new Date(),week=0,month=0;logs.forEach(x=>{let age=(Date.now()-new Date(x.date+"T23:59:59").getTime())/864e5,v=volume(x.sets);if(age<=7)week+=v;if(age<=30)month+=v});let recent=logs.slice(-10),max=Math.max(1,...recent.map(x=>volume(x.sets)));return `<div class=card><div class=row between><div><h2>${esc(e?.name||"Exercise")}</h2><div class=muted>${logs.length} logged workouts</div></div><span class=pr>${p.maxW?`PR ${p.maxW} kg`:""}</span></div><div class=grid><div><span class=muted>Last 7 days</span><div class=stat>${Math.round(week)} kg</div></div><div><span class=muted>Last 30 days</span><div class=stat>${Math.round(month)} kg</div></div></div><div class=section-title>Volume per workout</div><div class=chart>${recent.map(x=>`<div class=col style="height:${Math.max(3,Math.round(volume(x.sets)/max*125))}px" title="${x.date}: ${Math.round(volume(x.sets))} kg"><span>${Math.round(volume(x.sets))}</span></div>`).join("")}</div><div class=legend>Most recent ${recent.length} workouts</div></div>
<div class=card><b>History</b>${logs.slice().reverse().map(x=>`<div class=exercise><div class=row between><b>${fmt(x.date)}</b><span>${Math.round(volume(x.sets))} kg</span></div>${x.sets.map((s,i)=>`<div class=metric><span>Set ${i+1}</span><span>${s.weight||"—"} kg × ${s.reps||"—"} reps</span></div>`).join("")}</div>`).join("")}</div>`}
function settings(){return `<h2>Settings</h2><div class=card><div class=row between><div><b>Appearance</b><div class=muted>Dark / light</div></div><button onclick="db.theme=db.theme==='dark'?'light':'dark';save();theme();render()">${db.theme}</button></div></div>
<div class=card><b>Routine timer</b><div class=field><label>Default manual duration (minutes)</label><input id=mdur type=number min=0 value="${db.settings.defaultDuration||""}" placeholder="Optional"></div><button onclick="db.settings.defaultDuration=+document.getElementById('mdur').value||0;save();toast('Saved')">Save</button></div>
<div class=card><b>Backup</b><p class=muted>All app data currently lives on this device/browser. Export regularly.</p><div class=actions><button onclick=exportData()>Export backup</button><button class=secondary onclick="document.getElementById('file').click()">Import backup</button><input id=file class=hidden type=file accept=.json onchange=importData(this)></div></div>
<div class=card><b>Data</b><p class=muted>${db.routines.length} routines · ${db.history.length} completed workouts · ${Object.keys(db.schedule).length} scheduled days</p><button class=danger onclick=resetData()>Erase all data</button></div>
<div class=card><b>Dropbox</b><p class=muted>Dropbox sync is not enabled in this build. JSON backup is available now; OAuth-based Dropbox sync can be added without changing your workout data model.</p></div>`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`weights-backup-${today()}.json`;a.click()}
